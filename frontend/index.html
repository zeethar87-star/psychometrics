<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smart DXF MVP</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <h1>PDF → Smart DXF (MVP)</h1>
    <form id="upload-form">
      <input type="file" id="pdf" accept="application/pdf" required />
      <button type="submit">Upload & Process</button>
    </form>
    <p id="msg"></p>
  </main>
  <script>
    const form = document.getElementById('upload-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = document.getElementById('pdf').files[0];
      const fd = new FormData();
      fd.append('file', f);
      const res = await fetch('/api/upload', { method: 'POST', body: fd });
      if (!res.ok) { document.getElementById('msg').textContent = 'Upload failed'; return; }
      const data = await res.json();
      window.location.href = `/job/${data.job_id}`;
    });
  </script>
</body>
</html>
