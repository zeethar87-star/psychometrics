name: PSIE D027 V6 temporary acquisition

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acquire-v6:
    runs-on: ubuntu-24.04
    steps:
      - name: Acquire, verify, convert, and preflight fresh CAD families
        shell: bash
        run: |
          set -u
          mkdir -p out/original out/licenses out/normalized out/preflight out/renders out/logs tool
          : > out/logs/acquisition.tsv

          record() {
            printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" >> out/logs/acquisition.tsv
          }

          fetch_git() {
            id="$1"; url="$2"; outp="$3"; expected_size="$4"; expected_blob="$5"
            echo "== FETCH $id =="
            if ! curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 "$url" -o "$outp"; then
              record "$id" DOWNLOAD_FAIL "$url" curl
              rm -f "$outp"
              return 1
            fi
            actual_size="$(wc -c < "$outp" | tr -d ' ')"
            actual_blob="$(git hash-object "$outp")"
            if [ "$actual_size" != "$expected_size" ]; then
              record "$id" SIZE_MISMATCH "$actual_size" "$expected_size"
              rm -f "$outp"
              return 1
            fi
            if [ "$actual_blob" != "$expected_blob" ]; then
              record "$id" BLOB_MISMATCH "$actual_blob" "$expected_blob"
              rm -f "$outp"
              return 1
            fi
            if head -c 64 "$outp" | grep -qi '<html\|<!doctype'; then
              record "$id" HTML_REJECTED "$url" html
              rm -f "$outp"
              return 1
            fi
            record "$id" VERIFIED_GIT_BYTES "$actual_size" "$actual_blob"
            return 0
          }

          fetch_web_dwg() {
            id="$1"; url="$2"; outp="$3"; referer="$4"
            echo "== FETCH WEB $id =="
            ok=0
            for ua in \
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'; do
              if curl --fail --location --retry 2 --connect-timeout 20 \
                -A "$ua" -e "$referer" -H 'Accept: application/octet-stream,*/*;q=0.8' \
                "$url" -o "$outp"; then ok=1; break; fi
            done
            if [ "$ok" != 1 ]; then
              # second legitimate route: wget with referer/user-agent
              if wget -O "$outp" --timeout=25 --tries=2 \
                --referer="$referer" \
                --user-agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/151 Safari/537.36' \
                "$url"; then ok=1; fi
            fi
            if [ "$ok" != 1 ]; then
              record "$id" DOWNLOAD_FAIL "$url" curl+wget
              rm -f "$outp"
              return 1
            fi
            size="$(wc -c < "$outp" | tr -d ' ')"
            sig="$(head -c 6 "$outp" | tr -d '\000' || true)"
            if head -c 128 "$outp" | grep -qi '<html\|<!doctype'; then
              record "$id" HTML_REJECTED "$size" "$sig"
              rm -f "$outp"
              return 1
            fi
            if [ "$size" -lt 100000 ]; then
              record "$id" TOO_SMALL "$size" "$sig"
              rm -f "$outp"
              return 1
            fi
            case "$sig" in AC10*) ;; *) record "$id" DWG_SIGNATURE_REJECTED "$size" "$sig"; rm -f "$outp"; return 1;; esac
            record "$id" VERIFIED_WEB_DWG "$size" "$sig"
            return 0
          }

          # ------------------- exact GitHub fresh families -------------------
          fetch_git bbl_cafm \
            'https://raw.githubusercontent.com/bbl-dres/plan-check/main/assets/test-files/CAD.V01-CAFM-Plan-DE.dwg' \
            out/original/bbl_CAD.V01-CAFM-Plan-DE.dwg 381509 89ce7be18c73424944e85332641e244fda39e9a7 || true

          fetch_git bbl_arch2011 \
            'https://raw.githubusercontent.com/bbl-dres/plan-check/main/assets/test-files/2011-DM-0-A04-6A1.dwg' \
            out/original/bbl_2011-DM-0-A04-6A1.dwg 2017491 92cc5f339d494c7a94f25a6746a46b6f182579a8 || true

          fetch_git nayeem_tower \
            'https://raw.githubusercontent.com/nayeem-rafi/Advanced-Electrical-and-Civil-Layout-Design-for-a-Modern-High-Rise-Residential-Tower/main/Main%20Drwaing%20DWG%20File/Drawing_file.dwg' \
            out/original/nayeem_Drawing_file.dwg 893344 b88845abea7a6a55b7fd3c9368fd3233cd7d1193 || true

          # ------------------- official ETSU OER fresh family -------------------
          ETSU_PAGE='https://dc.etsu.edu/entc-2160-oer/5/'
          curl --fail --location --retry 2 "$ETSU_PAGE" -o out/licenses/etsu_module03b_rights.html || true
          fetch_web_dwg etsu_family_home \
            'https://dc.etsu.edu/cgi/viewcontent.cgi?article=1004&context=entc-2160-oer&filename=16&type=additional' \
            out/original/etsu_Family_Home_Floorplans.dwg "$ETSU_PAGE" || true
          fetch_web_dwg etsu_primary_bedroom \
            'https://dc.etsu.edu/cgi/viewcontent.cgi?article=1004&context=entc-2160-oer&filename=21&type=additional' \
            out/original/etsu_Primary_Bedroom_Floorplan.dwg "$ETSU_PAGE" || true

          # ------------------- direct-DXF fallbacks / independent buffers -------------------
          fetch_git qinchuan_sample \
            'https://raw.githubusercontent.com/qinchuan1122/cad-dwg-reader/main/samples/sample_simple.dxf' \
            out/original/qinchuan_sample_simple.dxf 63616 e769544f349b5c5551dd17c8eb94365814f0cd09 || true

          fetch_git omar_example \
            'https://raw.githubusercontent.com/omarmarzouk2018/CAD/main/Python/output/example_drawing.dxf' \
            out/original/omar_example_drawing.dxf 58941 4a6dae5b68ca9c9c0a1da369109fb3682abb7942 || true

          fetch_git red1oon_floor \
            'https://raw.githubusercontent.com/red1oon/BIMCompiler/master/deploy/dev/dxf/DX_FLOOR_GF.dxf' \
            out/original/red1oon_DX_FLOOR_GF.dxf 0 __DISCOVER__ || true

          # Correct red1oon helper: fetch without preknown size/blob, then record local identity.
          if [ ! -f out/original/red1oon_DX_FLOOR_GF.dxf ]; then
            if curl --fail --location --retry 3 \
              'https://raw.githubusercontent.com/red1oon/BIMCompiler/master/deploy/dev/dxf/DX_FLOOR_GF.dxf' \
              -o out/original/red1oon_DX_FLOOR_GF.dxf; then
              sz="$(wc -c < out/original/red1oon_DX_FLOOR_GF.dxf | tr -d ' ')"
              bl="$(git hash-object out/original/red1oon_DX_FLOOR_GF.dxf)"
              record red1oon_floor VERIFIED_GIT_BYTES_DISCOVERED "$sz" "$bl"
            fi
          fi

          # ------------------- rights evidence -------------------
          curl --fail --location 'https://raw.githubusercontent.com/bbl-dres/plan-check/main/LICENSE' -o out/licenses/bbl_LICENSE.txt || true
          curl --fail --location 'https://raw.githubusercontent.com/nayeem-rafi/Advanced-Electrical-and-Civil-Layout-Design-for-a-Modern-High-Rise-Residential-Tower/main/LICENSE' -o out/licenses/nayeem_LICENSE.txt || true
          curl --fail --location 'https://raw.githubusercontent.com/qinchuan1122/cad-dwg-reader/main/LICENSE' -o out/licenses/qinchuan_LICENSE.txt || true
          curl --fail --location 'https://raw.githubusercontent.com/omarmarzouk2018/CAD/main/Python/setup.py' -o out/licenses/omar_setup_license_evidence.py || true
          curl --fail --location 'https://raw.githubusercontent.com/red1oon/BIMCompiler/master/README.md' -o out/licenses/red1oon_README_license_evidence.md || true

          # ------------------- pinned LibreDWG binary bridge -------------------
          fetch_git libredwg_bundle \
            'https://raw.githubusercontent.com/Long68-code/claude-dwg-assets/main/libredwg_ubuntu24.tar.gz' \
            tool/libredwg_ubuntu24.tar.gz 6386831 f30d50ed8e86094a43ca88a90c5f5cdf9d6ef048 || true
          if [ -f tool/libredwg_ubuntu24.tar.gz ]; then
            mkdir -p tool/libredwg
            tar xzf tool/libredwg_ubuntu24.tar.gz -C tool/libredwg
            find tool/libredwg -maxdepth 3 -type f -printf '%p\n' > out/logs/libredwg_files.txt
            DWG2DXF="$(find tool/libredwg -type f -name dwg2dxf | head -1)"
            if [ -n "$DWG2DXF" ]; then chmod +x "$DWG2DXF"; fi
            LIBDIR="$(dirname "$(find tool/libredwg -type f -name 'libredwg.so*' | head -1)")"
            if [ -n "${DWG2DXF:-}" ] && [ -x "$DWG2DXF" ]; then
              LD_LIBRARY_PATH="$LIBDIR" "$DWG2DXF" --version > out/logs/libredwg_version.txt 2>&1 || true
              for f in out/original/*.dwg; do
                [ -e "$f" ] || continue
                base="$(basename "$f" .dwg)"
                echo "== CONVERT $base =="
                if LD_LIBRARY_PATH="$LIBDIR" "$DWG2DXF" -y -o "out/normalized/${base}.dxf" "$f" >"out/logs/${base}_dwg2dxf.log" 2>&1; then
                  record "$base" DWG2DXF_OK "$(wc -c < "out/normalized/${base}.dxf" | tr -d ' ')" "$DWG2DXF"
                else
                  record "$base" DWG2DXF_FAIL "$f" "$DWG2DXF"
                  rm -f "out/normalized/${base}.dxf"
                fi
              done
            else
              record libredwg_tool TOOL_NOT_FOUND tar_extracted no_dwg2dxf
            fi
          fi

          # copy checked-in DXF originals to normalized unchanged for inspection only
          for f in out/original/*.dxf; do
            [ -e "$f" ] || continue
            cp "$f" "out/normalized/$(basename "$f")"
          done

          # ------------------- parse + text/layers + controlled render -------------------
          python3 -m pip install --quiet 'ezdxf>=1.3' matplotlib pillow
          python3 - <<'PY'
          import json, math, os, pathlib, hashlib, traceback
          import ezdxf
          from ezdxf import bbox
          from ezdxf.addons.drawing import Frontend, RenderContext
          from ezdxf.addons.drawing.matplotlib import MatplotlibBackend
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt

          root=pathlib.Path('out')
          rows=[]
          for p in sorted((root/'normalized').glob('*.dxf')):
              rec={'file':p.name,'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size}
              try:
                  doc=ezdxf.readfile(p)
                  msp=doc.modelspace()
                  ents=list(msp)
                  rec['parse']='PASS'
                  rec['entities']=len(ents)
                  counts={}
                  for e in ents: counts[e.dxftype()]=counts.get(e.dxftype(),0)+1
                  rec['entity_types']=counts
                  rec['layers']=[x.dxf.name for x in doc.layers]
                  texts=[]
                  for e in ents:
                      if e.dxftype()=='TEXT':
                          texts.append({'type':'TEXT','text':e.dxf.text,'insert':[float(e.dxf.insert.x),float(e.dxf.insert.y)]})
                      elif e.dxftype()=='MTEXT':
                          texts.append({'type':'MTEXT','text':e.plain_text(),'insert':[float(e.dxf.insert.x),float(e.dxf.insert.y)]})
                  rec['texts']=texts[:500]
                  rec['text_count']=len(texts)
                  try:
                      ext=bbox.extents(ents, fast=True)
                      if ext.has_data:
                          rec['bbox']={'min':[float(ext.extmin.x),float(ext.extmin.y)],'max':[float(ext.extmax.x),float(ext.extmax.y)]}
                  except Exception as ex:
                      rec['bbox_error']=repr(ex)
                  try:
                      fig=plt.figure(figsize=(14,10),dpi=100)
                      ax=fig.add_axes([0.01,0.01,0.98,0.98])
                      ctx=RenderContext(doc)
                      out=MatplotlibBackend(ax)
                      Frontend(ctx,out).draw_layout(msp, finalize=True)
                      ax.set_aspect('equal', adjustable='datalim')
                      ax.axis('off')
                      fig.savefig(root/'renders'/f'{p.stem}.png',dpi=180,bbox_inches='tight',pad_inches=0.02)
                      plt.close(fig)
                      rec['render']='PASS'
                  except Exception as ex:
                      plt.close('all')
                      rec['render']='FAIL'
                      rec['render_error']=repr(ex)
              except Exception as ex:
                  rec['parse']='FAIL'
                  rec['error']=repr(ex)
                  rec['traceback']=traceback.format_exc()
              rows.append(rec)
              (root/'preflight'/f'{p.stem}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'preflight'/'ALL_PREFLIGHT.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          # immutable-byte manifest
          (cd out && find original licenses normalized preflight renders logs -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          python3 - <<'PY'
          import pathlib, hashlib, json
          root=pathlib.Path('out')
          src=[]
          for p in sorted((root/'original').glob('*')):
              if p.is_file():
                  b=p.read_bytes()
                  src.append({'filename':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'signature_hex':b[:16].hex()})
          (root/'V6_ACQUISITION_RESULT.json').write_text(json.dumps({'protocol':'D027_V6','status':'CI_MATERIALIZED','originals':src},indent=2)+'\n')
          PY
          (cd out && zip -qr ../D027_V6_CI_ACQUISITION_RESULT.zip .)

      - name: Upload V6 acquisition/preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: d027-v6-acquisition-preflight
          path: D027_V6_CI_ACQUISITION_RESULT.zip
          if-no-files-found: error
          retention-days: 1
